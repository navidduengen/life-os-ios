name: CI

# Budget decision: docs/actions-budget.md. Automatic checks require Navid approval.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: LifeOSKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Swift test
        working-directory: Packages/LifeOSKit
        run: swift test

  app:
    name: App build (${{ matrix.name }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone/iPad
            destination: generic/platform=iOS Simulator
          - name: Mac
            destination: platform=macOS,variant=Mac Catalyst
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild build -quiet \
            -project LifeOS.xcodeproj \
            -scheme LifeOS \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Check Info.plist privacy texts
        if: matrix.name == 'iPhone/iPad'
        run: |
          plist=$(find build/Build/Products -path '*LifeOS.app/Info.plist' | head -1)
          for key in NSHealthShareUsageDescription NSHealthUpdateUsageDescription NSHealthClinicalHealthRecordsShareUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$plist" > /dev/null || { echo "missing $key in $plist"; exit 1; }
          done
